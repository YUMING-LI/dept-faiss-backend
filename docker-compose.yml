version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: shdnetwork-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      web:
        aliases:
          - redis
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  ihd-faiss-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ihd-faiss-backend
    container_name: ihd-faiss-backend
    env_file:
      - /home/shduser/Docker_static/ihd-faiss-backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RSA_DIR=/app/secret/rsa
    volumes:
      - /home/shduser/Docker_static/dept/secret:/app/secret:ro
    depends_on:
      - redis
    networks:
      web:
        aliases:
          - ihd-faiss-backend
    expose: ["80"]
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M


networks:
  web:
    external: true
    name: shdnetwork
